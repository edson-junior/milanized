name: Lighthouse CI

on:
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
      CLIENT_URL: http://localhost:3000
      NEXT_PUBLIC_CLIENT_URL: http://localhost:3000
      # Allows LHCI to post status checks back to GitHub pull requests
      LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Collect runs first and always writes results to .lighthouseci/
      - name: Collect Lighthouse results
        run: pnpm exec lhci collect

      # Assert separately so a budget failure doesn't skip the upload/artifact steps
      - name: Assert Lighthouse budgets
        run: pnpm exec lhci assert
        continue-on-error: true

      - name: Upload to temporary public storage
        run: pnpm exec lhci upload

      - name: Upload Lighthouse results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 14
